name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
  on-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when asked
        run: |
          if [ -f FAIL ]; then
            echo "The branch has a FAIL file:"
            cat FAIL
            echo "::error file=FAIL,line=1::Remove FAIL to make this check pass"
            exit 1
          fi
          echo "No FAIL file: passing."
